<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="midtransGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="40" rx="8" fill="url(#midtransGradient)"/>
  
  <!-- Icon -->
  <g transform="translate(8, 8)">
    <!-- Credit card icon -->
    <rect x="0" y="6" width="20" height="12" rx="2" fill="white" opacity="0.9"/>
    <rect x="0" y="9" width="20" height="2" fill="url(#midtransGradient)"/>
    <circle cx="3" cy="14" r="1" fill="url(#midtransGradient)"/>
    <circle cx="6" cy="14" r="1" fill="url(#midtransGradient)"/>
  </g>
  
  <!-- Text -->
  <text x="32" y="14" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">MIDTRANS</text>
  <text x="32" y="24" font-family="Arial, sans-serif" font-size="6" fill="white" opacity="0.8">Payment Gateway</text>
</svg>
